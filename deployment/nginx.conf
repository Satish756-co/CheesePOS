worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/x-javascript image/svg+xml;

    upstream backend {
        server backend:5000;
        keepalive 32;
    }

    upstream frontend {
        server frontend:80;
    }

    # ── Phase 1: HTTP-only (before SSL certificate is issued) ─────────
    # This config is safe to start with. Run the following to get a certificate,
    # then switch to nginx.conf.https:
    #
    #   docker-compose run --rm certbot certonly --webroot \
    #     --webroot-path=/var/www/certbot \
    #     --email your@email.com \
    #     --agree-tos --no-eff-email \
    #     -d yourdomain.com -d www.yourdomain.com
    #
    # After the certificate is issued:
    #   cp deployment/nginx.conf.https deployment/nginx.conf
    #   # Edit server_name in nginx.conf to match your domain
    #   docker-compose restart nginx

    server {
        listen 80;
        server_name _;

        # Let's Encrypt ACME challenge (needed for certificate issuance)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            client_max_body_size 20M;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }
    }
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend service
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 20M;
    }

    # Proxy uploaded files to the backend service
    location /uploads/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400";
    }

    # Vite bundles assets with content hashes — safe to cache for 1 year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — all routes return index.html so React Router handles them
    location / {
        try_files $uri $uri/ /index.html;
    }
}
